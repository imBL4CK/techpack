#Deafening / FOV mob-stealth
[deafening]
	#If true, a deafened mob DROPS an already-acquired player target when the
	#player leaves its frontal FOV cone or line of sight (checked twice a second).
	#If false, deafening only blocks fresh acquisition. Default: true
	disengageOnConeExit = true
	#Max eligible (non-immune) mobs within a deafening burst's radius.
	#Above this, the burst deafens NOBODY (a crowd notices you anyway);
	#the screech and startle still happen. Default: 16
	# Default: 16
	# Range: 0 ~ 1024
	localCap = 16
	#Hard safety ceiling on eligible mobs scanned per burst (performance guardrail).
	#Default: 64
	# Default: 64
	# Range: 0 ~ 4096
	globalCap = 64
	#Anger applied to a Warden when a deafening potion breaks near it.
	#80 is vanilla's 'angry' threshold (roars + pursues). Default: 80
	# Default: 80
	# Range: 0 ~ 150
	wardenEnrageAnger = 80
	#A deafened Warden still senses the player by smell within this radius (blocks).
	#Beyond it, the player's vibration-driven anger is suppressed. Default: 4
	# Default: 4
	# Range: 0 ~ 64
	wardenSmellRadius = 4

#Create: Aeronautics void sea
[aeronautics]
	#Void sea height relative to the End floor (the auroracite layer at the world's min-Y), in blocks.
	#Positive raises the sea; the void-death line stays put. Negative lowers the sea below the floor
	#AND lowers the void-death line in step (same 64-block buffer), so contraptions and pilots ride
	#the lowered sea instead of voiding out. Default: 2
	# Default: 2
	# Range: -64 ~ 256
	voidSeaOffsetAboveFloor = 2

#Gameplay
[gameplay]
	#The totem of respite allows you to get your items back after death. Some mods will conflict with this
	#The config stops the totem from being obtained during the Bonfire ritual
	DropTotemOfRespite = true
	#The resolution at which the prismograph takes snapshots.
	#Higher values look sharper but cost more memory and bandwidth
	#Allowed Values: x16, x32, x64, x128, x256
	PrismographResolution = "x64"
	#Posterization quant step: 1 = full color, higher = coarser bands (~10 reads retro).
	#Changing this is costless, it is purely to taste
	# Default: 10
	# Range: 1 ~ 20
	PrismographPosterization = 10
	#Most trinkets one player's ocarina commands at once, nearest first. 0 removes the limit
	# Default: 0
	# Range: 0 ~ 100000
	OcarinaMaxTrinkets = 0
	#Enadrakes follow mobGriefing like vanilla mobs: with it off they stop taking items, planting, harvesting and building refuges
	EnadrakesRespectMobGriefing = false
